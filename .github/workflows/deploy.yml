name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - test
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: isp
          POSTGRES_PASSWORD: isp
          POSTGRES_DB: isp_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://isp:isp@localhost:5432/isp_platform
      REDIS_URL: redis://localhost:6379
      API_INTERNAL_KEY: test_internal_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm run migrate

      - name: Run tests
        run: pnpm run test

      - name: Deploy to Coolify (Test Environment)
        if: github.ref == 'refs/heads/test' && success()
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_TEST }}" ]; then
            echo "Triggering Coolify Test deployment..."
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_TEST }}"
          else
            echo "COOLIFY_WEBHOOK_TEST is not set. Skipping deployment."
          fi

      - name: Deploy to Coolify (Main Environment)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_MAIN }}" ]; then
            echo "Triggering Coolify Main deployment..."
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_MAIN }}"
          else
            echo "COOLIFY_WEBHOOK_MAIN is not set. Skipping deployment."
          fi
