version: "3.9"
 
services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + extension "vector" ya compilada
    # (necesaria para el vector store de RAG de n8n, docs/spec/04_N8N_WORKFLOW_SPEC.md §6.2).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp
      POSTGRES_DB: isp_platform
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
 
  redis:
    image: redis:7
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
 
  # Opcional: para probar el 04_N8N_WORKFLOW_SPEC.md en local antes de tocar el n8n de producción
  n8n:
    image: n8nio/n8n:2.33.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # Debe coincidir con API_INTERNAL_KEY de la API (workflows validan X-Internal-Api-Key)
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:-dev-local-internal-key-change-me}
      # Permite {{ $env.API_INTERNAL_KEY }} en nodos IF/Code
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Persistir entre recreates; si falta, n8n genera una nueva y rompe OAuth
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-local-n8n-encryption-key-change-me}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: isp_platform
      DB_POSTGRESDB_USER: isp
      DB_POSTGRESDB_PASSWORD: isp
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://isp:isp@postgres:5432/isp_platform
      - REDIS_URL=redis://redis:6379/0
      - API_INTERNAL_KEY=${API_INTERNAL_KEY:-dev-local-internal-key-change-me}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-43200}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
    depends_on:
      - postgres
      - redis
 
volumes:
  pgdata:
 