global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Backend Principal (Communication Backend)
  - job_name: "isp_communication_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"] # O "communication_backend:3000" en red Docker
        labels:
          environment: "production"
          service: "backend_core"

  # 2. Segunda API (API MikroTik / OLT)
  - job_name: "isp_mikrotik_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"] # O "mikrotik_api:3001" en red Docker
        labels:
          environment: "production"
          service: "api_mikrotik"

  # 3. Monitoreo de Host / Servidor Linux (CPU, RAM, Disco)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          environment: "production"
          service: "host_server"

  # 4. Monitoreo de Disponibilidad del Frontend (Blackbox / HTTP Probe)
  # - job_name: "frontend_probe"
